<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workspace Setup | VANTERA</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/vantera-icon.png" type="image/png">
</head>

<body>

    <header class="site-header">
        <div class="container nav">
            <a class="logo" href="index.html"><img src="assets/vantera-logo.png" alt="VANTERA logo"></a>
            <nav class="nav-links">
                <a href="product.html">Product</a><a href="solutions.html">Solutions</a><a
                    href="parent.html">Families</a><a href="pricing.html">Pricing</a><a
                    href="resources.html">Resources</a>
            </nav>
            <div class="nav-actions"><a class="btn btn-outline desktop-only" href="login.html">Log in</a><a
                    class="btn btn-primary" href="signup.html">Get Started</a></div>
            <button class="menu">☰</button>
        </div>
    </header>

    <main class="onboard">
        <div class="container" style="max-width:760px"><a class="logo" href="index.html"><img
                    src="assets/vantera-logo.png" alt="VANTERA logo"></a>
            <div class="progress"><span style="width:75%"></span></div>
            <section class="card" style="padding:40px"><span class="eyebrow">Step 4 of 5</span>
                <h1>Create your workspace</h1>
                <p class="muted">You can change these details later.</p>
                <div class="form-group"><label>Workspace name</label><input placeholder="e.g. My Business"></div>
                <div class="form-group"><label>Team size</label><select>
                        <option>Just me</option>
                        <option>2–10</option>
                        <option>11–50</option>
                        <option>51–250</option>
                        <option>250+</option>
                    </select></div>
                <div class="form-group"><label>What do you want to accomplish?</label>
                    <div class="choice-grid"><label class="choice"><input type="checkbox"> Manage tasks</label><label
                            class="choice"><input type="checkbox"> Organize projects</label><label class="choice"><input
                                type="checkbox"> Manage documents</label><label class="choice"><input type="checkbox">
                            Work with a team</label></div>
                </div><a class="btn btn-primary" href="setup-complete.html">Finish Setup</a>
            </section>
        </div>
    </main>

    <script src="js/vantera.js" defer></script>
</body>

</html>
