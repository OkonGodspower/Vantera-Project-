<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your password | VANTERA</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/vantera-icon.png" type="image/png">
</head>

<body>

    <main class="auth-page">
        <section class="auth-brand">
            <div>
                <div class="logo" style="color:white"><img src="assets/vantera-logo.png" alt="VANTERA logo"></div>
                <h1>Reset your password</h1>
                <p>Everything you need to move forward. A flexible workspace for people, teams and organizations.</p>
            </div>
        </section>
        <section class="auth-form-wrap">
            <div class="form-box">
                <h1>Forgot your password?</h1>
                <p class="muted">Enter your email and we'll prepare a reset link.</p>
                <div class="form-group"><label>Email</label><input type="email" placeholder="you@example.com"></div><a
                    class="btn btn-primary full" href="reset-password.html">Send Reset Link</a>
                <p class="auth-note"><a href="login.html">Back to login</a></p>
            </div>
        </section>
    </main>

    <script src="js/vantera.js" defer></script>
</body>

</html>
